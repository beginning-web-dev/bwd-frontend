<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beginning Web Development</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>

  <section class="hero-container">
    <div class="text-col">
      <p class="header-text">Welcome to the <span style="color:#7642BA">Greatest</span> Online Community!</p>
      <p class="sub-text">
        We are a rapidly growing group that started off on Meetup.com. Join us every Monday on our coding adventures.
        Sign up to stay up to date on meetings and activities. We promise you’ll enjoy your stay at BWD (Beginning Web
        Development)!
      </p>
      <button class="meetup-btn" alt="button to meetup">
        <a href="https://www.meetup.com/beginning-web-development/" target="_blank">
          <div class="content">
            <img src="./assets/meetupLogo.png" class="meetup-logo" alt="Meetup Logo">
            Join Today
          </div>
        </a>
      </button>
    </div>
    <div class="image-col">
      <img src="./assets/groupImg.jpeg" class="hero-img" alt="Hero Image">
    </div>
  </section>

  <script src="main.js"></script>
</body>

</html>
